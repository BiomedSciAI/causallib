# Documentation: https://docs.readthedocs.io/en/stable/config-file/v2.html

# Configuration file version:
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.11"
  # jobs:
  #   post_checkout:
  #     - ls docs/
  #   post_build:
  #     - sphinx-build -b linkcheck docs docs/_build/linkcheck

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false

# # Additional documentation formats (pdf, etc.)
# formats:
#   - pdf
#   - epub

# Python and requirements required to build your docs
python:
  install:
    - requirements: docs/requirements.txt  # already includes causallib

